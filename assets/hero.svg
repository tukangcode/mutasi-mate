<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Mutasi Mate — turn bank statements and screenshots into a spending report">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2f2f"/>
      <stop offset="0.55" stop-color="#124a4a"/>
      <stop offset="1" stop-color="#1e7b7b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ec8c8"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <g opacity="0.10" fill="none" stroke="#ffffff" stroke-width="1.2">
    <circle cx="1050" cy="40" r="150"/>
    <circle cx="1050" cy="40" r="110"/>
    <circle cx="120" cy="320" r="130"/>
    <path d="M0 250 C 240 210, 380 300, 620 250 S 980 190, 1200 240"/>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="64" y="112" fill="#ffffff" font-size="46" font-weight="700" letter-spacing="-1.4">Mutasi Mate</text>
    <text x="64" y="152" fill="#bfe3e3" font-size="17">Rekening koran &amp; screenshot &#8594; laporan pengeluaran.</text>
    <text x="64" y="176" fill="#8fc4c4" font-size="15">Offline. Tanpa upload. Tanpa API key.</text>

    <g font-size="13" font-weight="600">
      <rect x="64" y="204" width="96" height="30" rx="15" fill="#ffffff" fill-opacity="0.10" stroke="#5ec8c8" stroke-opacity="0.45"/>
      <text x="112" y="224" fill="#d8f2f2" text-anchor="middle">PDF</text>

      <rect x="170" y="204" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.10" stroke="#5ec8c8" stroke-opacity="0.45"/>
      <text x="245" y="224" fill="#d8f2f2" text-anchor="middle">Screenshot OCR</text>

      <rect x="330" y="204" width="128" height="30" rx="15" fill="#ffffff" fill-opacity="0.10" stroke="#5ec8c8" stroke-opacity="0.45"/>
      <text x="394" y="224" fill="#d8f2f2" text-anchor="middle">CSV</text>

      <rect x="468" y="204" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.10" stroke="#c9a227" stroke-opacity="0.55"/>
      <text x="543" y="224" fill="#f0dfa8" text-anchor="middle">HTML + Excel</text>
    </g>

    <g font-size="12" fill="#7fb3b3" letter-spacing="0.6">
      <text x="64" y="272">OPEN SOURCE &#183; MIT</text>
    </g>
  </g>

  <g transform="translate(660,72)" filter="url(#soft)">
    <rect x="0" y="0" width="150" height="104" rx="14" fill="#ffffff" fill-opacity="0.94"/>
    <rect x="22" y="22" width="42" height="56" rx="4" fill="#e3ecec" stroke="#9fc2c2" stroke-width="1.5"/>
    <line x1="30" y1="36" x2="56" y2="36" stroke="#1e7b7b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="30" y1="46" x2="56" y2="46" stroke="#9fc2c2" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="30" y1="56" x2="48" y2="56" stroke="#9fc2c2" stroke-width="2.5" stroke-linecap="round"/>
    <text x="76" y="46" fill="#124a4a" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Input</text>
    <text x="76" y="64" fill="#5f8181" font-size="11" font-family="system-ui, sans-serif">PDF / foto</text>
  </g>

  <g transform="translate(845,72)" filter="url(#soft)">
    <rect x="0" y="0" width="150" height="104" rx="14" fill="#ffffff" fill-opacity="0.94"/>
    <rect x="20" y="24" width="54" height="54" rx="4" fill="#e3ecec" stroke="#9fc2c2" stroke-width="1.5"/>
    <line x1="20" y1="42" x2="74" y2="42" stroke="#9fc2c2" stroke-width="1.5"/>
    <line x1="20" y1="60" x2="74" y2="60" stroke="#9fc2c2" stroke-width="1.5"/>
    <line x1="38" y1="24" x2="38" y2="78" stroke="#9fc2c2" stroke-width="1.5"/>
    <line x1="56" y1="24" x2="56" y2="78" stroke="#9fc2c2" stroke-width="1.5"/>
    <rect x="21" y="43" width="16" height="16" fill="#1e7b7b" fill-opacity="0.55"/>
    <text x="84" y="46" fill="#124a4a" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Data</text>
    <text x="84" y="64" fill="#5f8181" font-size="11" font-family="system-ui, sans-serif">CSV 7 kolom</text>
  </g>

  <g transform="translate(1030,72)" filter="url(#soft)">
    <rect x="0" y="0" width="150" height="104" rx="14" fill="#ffffff" fill-opacity="0.94"/>
    <rect x="24" y="58" width="12" height="22" rx="3" fill="#1e7b7b"/>
    <rect x="42" y="44" width="12" height="36" rx="3" fill="#2f9598"/>
    <rect x="60" y="30" width="12" height="50" rx="3" fill="#c9a227"/>
    <text x="86" y="46" fill="#124a4a" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Laporan</text>
    <text x="86" y="64" fill="#5f8181" font-size="11" font-family="system-ui, sans-serif">HTML + XLSX</text>
  </g>

  <g stroke="#5ec8c8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M816 124 h22" marker-end="url(#a1)"/>
    <path d="M1001 124 h22" marker-end="url(#a1)"/>
  </g>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5ec8c8"/>
    </marker>
  </defs>
</svg>
