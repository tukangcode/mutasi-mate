<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Pipeline: extract, categorise, report, reconcile">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e7b7b"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9a227"/>
    </marker>
  </defs>

  <rect width="1000" height="300" fill="#ffffff"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- ============ STEP 1 ============ -->
    <g>
      <rect x="30" y="60" width="210" height="150" rx="12" fill="#f5f8f8" stroke="#e3ecec" stroke-width="1.5"/>
      <circle cx="58" cy="88" r="14" fill="#1e7b7b"/>
      <text x="58" y="93" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">1</text>
      <text x="80" y="93" fill="#124a4a" font-size="15" font-weight="700">Ekstrak</text>

      <text x="48" y="126" fill="#5f8181" font-size="11.5">PDF / screenshot / foto</text>
      <text x="48" y="144" fill="#5f8181" font-size="11.5">&#8595; teks (PDF) atau OCR</text>
      <text x="48" y="162" fill="#5f8181" font-size="11.5">&#8595; parser</text>

      <rect x="48" y="176" width="174" height="22" rx="5" fill="#e6f4f4" stroke="#9fc2c2" stroke-width="1"/>
      <text x="135" y="191" fill="#12595c" font-size="11.5" font-weight="600" text-anchor="middle">transaksi.csv</text>
    </g>

    <path d="M248 135 h28" stroke="#1e7b7b" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

    <!-- ============ STEP 2 ============ -->
    <g>
      <rect x="286" y="60" width="210" height="150" rx="12" fill="#f5f8f8" stroke="#e3ecec" stroke-width="1.5"/>
      <circle cx="314" cy="88" r="14" fill="#1e7b7b"/>
      <text x="314" y="93" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">2</text>
      <text x="336" y="93" fill="#124a4a" font-size="15" font-weight="700">Kategori</text>

      <text x="304" y="126" fill="#5f8181" font-size="11.5">cocokkan kata kunci</text>
      <text x="304" y="144" fill="#5f8181" font-size="11.5">dari aturan sendiri</text>

      <rect x="304" y="160" width="174" height="38" rx="5" fill="#ffffff" stroke="#9fc2c2" stroke-width="1"/>
      <text x="314" y="175" fill="#12595c" font-size="10.5" font-family="ui-monospace, Consolas, monospace">indomaret|Groceries</text>
      <text x="314" y="189" fill="#12595c" font-size="10.5" font-family="ui-monospace, Consolas, monospace">tarik tunai|Pindah</text>
    </g>

    <path d="M504 135 h28" stroke="#1e7b7b" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

    <!-- ============ STEP 3 ============ -->
    <g>
      <rect x="542" y="60" width="210" height="150" rx="12" fill="#f5f8f8" stroke="#e3ecec" stroke-width="1.5"/>
      <circle cx="570" cy="88" r="14" fill="#1e7b7b"/>
      <text x="570" y="93" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">3</text>
      <text x="592" y="93" fill="#124a4a" font-size="15" font-weight="700">Laporan</text>

      <text x="560" y="126" fill="#5f8181" font-size="11.5">belanja / pindah dana / masuk</text>
      <text x="560" y="144" fill="#5f8181" font-size="11.5">per kategori, per bulan</text>

      <rect x="560" y="158" width="174" height="22" rx="5" fill="#e6f4f4" stroke="#9fc2c2" stroke-width="1"/>
      <text x="647" y="173" fill="#12595c" font-size="11.5" font-weight="600" text-anchor="middle">laporan.html</text>

      <rect x="560" y="184" width="174" height="22" rx="5" fill="#e6f4f4" stroke="#9fc2c2" stroke-width="1"/>
      <text x="647" y="199" fill="#12595c" font-size="11.5" font-weight="600" text-anchor="middle">tracker.xlsx</text>
    </g>

    <path d="M760 135 h28" stroke="#c9a227" stroke-width="2.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ar2)"/>

    <!-- ============ STEP 4 (optional) ============ -->
    <g>
      <rect x="798" y="60" width="172" height="150" rx="12" fill="#fdf8ec" stroke="#e8d9a8" stroke-width="1.5" stroke-dasharray="6 4"/>
      <circle cx="826" cy="88" r="14" fill="#c9a227"/>
      <text x="826" y="93" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">4</text>
      <text x="848" y="93" fill="#6b5310" font-size="15" font-weight="700">Opsional</text>

      <text x="816" y="126" fill="#8a7223" font-size="11.5">top up e-wallet</text>
      <text x="816" y="144" fill="#8a7223" font-size="11.5">vs daftar belanja</text>
      <text x="816" y="162" fill="#8a7223" font-size="11.5">metode FIFO</text>

      <rect x="816" y="176" width="136" height="22" rx="5" fill="#ffffff" stroke="#e8d9a8" stroke-width="1"/>
      <text x="884" y="191" fill="#6b5310" font-size="11" font-weight="600" text-anchor="middle">rekonsiliasi.csv</text>
    </g>

    <!-- ============ caption ============ -->
    <text x="30" y="248" fill="#8aa3a3" font-size="11.5">Semua langkah jalan lokal. Tidak ada data yang keluar dari komputer.</text>
    <text x="30" y="266" fill="#8aa3a3" font-size="11.5">Langkah 4 hanya perlu kalau kamu ingin tahu uang ShopeePay dipakai buat apa.</text>

    <!-- ============ input sources ============ -->
    <g font-size="10.5" fill="#8aa3a3">
      <text x="30" y="42">INPUT</text>
      <line x1="30" y1="48" x2="240" y2="48" stroke="#e3ecec" stroke-width="1"/>
      <text x="798" y="42">HASIL TAMBAHAN</text>
      <line x1="798" y1="48" x2="970" y2="48" stroke="#e8d9a8" stroke-width="1"/>
    </g>
  </g>
</svg>
